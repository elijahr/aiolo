name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install liblo and build tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblo-dev pkg-config

      - name: Install liblo and build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install liblo pkg-config

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build "cython>=3.0" "setuptools>=61.0" wheel pytest pytest-asyncio

      - name: Build sdist
        run: |
          python -m build --sdist

      - name: Install package
        run: |
          python -m pip install -e . --no-build-isolation

      - name: Run test suite
        run: |
          python -m pytest -v
